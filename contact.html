<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Joy of Living</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>

<body>
    <div class="custom-cursor"></div>
    <div class="page-transition"></div>
    <div class="background-blur"></div>

    <div class="app-container">
        <main class="contact-page">
            <div class="contact-container">
                <h1 class="stagger-text">Let's Connect</h1>
                <div class="contact-info fade-in-text">
                    <div class="contact-block">
                        <h3>Inquiries</h3>
                        <a href="mailto:hello@joyofliving.com" class="hover-target">hello@joyofliving.com</a>
                        <p>+971 50 123 4567</p>
                    </div>
                    <div class="contact-block">
                        <h3>Studio</h3>
                        <p>Dubai Design District (d3)<br>Building 6, Office 402<br>Dubai, UAE</p>
                    </div>
                    <div class="contact-block">
                        <h3>Social</h3>
                        <div class="social-icons" style="justify-content: flex-start; margin-top: 15px;">
                            <a href="#" aria-label="Instagram" class="hover-target">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                            </a>
                            <a href="#" aria-label="Pinterest" class="hover-target">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.1 2.9c-2.4-2.4-6.4-2.4-8.8 0L2.9 12.3c-2.4 2.4-2.4 6.4 0 8.8 2.4 2.4 6.4 2.4 8.8 0l9.4-9.4c2.4-2.4 2.4-6.4 0-8.8z"></path><path d="M12 22v-6"></path><path d="M12 8V2"></path><path d="M18 14h-4"></path><path d="M10 14H6"></path></svg>
                            </a>
                            <a href="#" aria-label="LinkedIn" class="hover-target">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="contact-form-wrapper">
                    <form class="contact-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required placeholder="john@example.com">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject" required placeholder="Project Inquiry">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Tell us about your project..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit hover-target">Send Message</button>
                    </form>
                </div>
            </div>
        </main>

    </div>

    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
