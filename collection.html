<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections & Services | Joy of Living</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>

<body>
    <div class="custom-cursor"></div>
    <div class="page-transition"></div>
    <div class="background-blur"></div>

    <div class="app-container">
        <main class="collection-page">
            <div class="collection-header">
                <h1 class="stagger-text">Our Portfolio</h1>
                <p class="fade-in-text">A curated selection of our finest architectural and interior achievements, blending modern aesthetics with timeless comfort.</p>
            </div>

            <div class="portfolio-grid">
                <!-- Portfolio Item 1 -->
                <div class="portfolio-item">
                    <div class="portfolio-img-wrapper">
                        <img src="images/collection1.jpg" alt="Minimalist Villa" class="parallax-img">
                    </div>
                    <div class="portfolio-info">
                        <h3>Minimalist Villa</h3>
                        <p>Residential / Dubai</p>
                    </div>
                </div>

                <!-- Portfolio Item 2 -->
                <div class="portfolio-item">
                    <div class="portfolio-img-wrapper">
                        <img src="images/collection2.jpg" alt="Urban Penthouse" class="parallax-img">
                    </div>
                    <div class="portfolio-info">
                        <h3>Urban Penthouse</h3>
                        <p>Commercial / London</p>
                    </div>
                </div>

                <!-- Portfolio Item 3 -->
                <div class="portfolio-item">
                    <div class="portfolio-img-wrapper">
                        <img src="images/collection3.jpg" alt="Serene Retreat" class="parallax-img">
                    </div>
                    <div class="portfolio-info">
                        <h3>Serene Retreat</h3>
                        <p>Hospitality / Bali</p>
                    </div>
                </div>

                <!-- Portfolio Item 4 -->
                <div class="portfolio-item">
                    <div class="portfolio-img-wrapper">
                        <img src="images/collection4.jpg" alt="Modern Workspace" class="parallax-img">
                    </div>
                    <div class="portfolio-info">
                        <h3>Modern Workspace</h3>
                        <p>Office / New York</p>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
